name: Rebuild viewers

# Edit markdown in docs/ from anywhere — including GitHub's mobile web editor —
# and this regenerates the HTML and commits it. Cloudflare Pages then redeploys.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'build/**'
      - 'files/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate viewers
        run: python3 build/build.py

      - name: Commit if changed
        run: |
          # Every page build.py writes, not just the two tree pages. A page whose
          # HTML is regenerated but never committed looks like a silent no-op:
          # the run goes green and the site never changes.
          if [[ -z "$(git status --porcelain -- '*.html')" ]]; then
            echo "No change to the generated viewers."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "build: regenerate viewers from docs/ [skip ci]"
          git push
